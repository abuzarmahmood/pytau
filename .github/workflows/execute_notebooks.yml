name: Execute Notebooks

on:
  pull_request:
    paths:
      - '**.ipynb'
      - 'pytau/**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
    types: [closed]

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
    - name: Determine which notebooks need re-execution
      id: changed
      run: |
        CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
        echo "Files changed in merged PR:"
        echo "$CHANGED_FILES"

        # Changes to core library code can affect every notebook's output,
        # so treat them as "re-execute everything". Notebooks and how_to/
        # example scripts don't count as library code for this purpose.
        LIB_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^pytau/[^/]+\.py$|^pytau/(utils|config)/' || true)

        if [ -n "$LIB_CHANGED" ]; then
          echo "Core library code changed:"
          echo "$LIB_CHANGED"
          echo "Re-executing all notebooks"
          NOTEBOOKS=$(ls pytau/how_to/model_notebooks/*.ipynb)
        else
          NOTEBOOKS=$(echo "$CHANGED_FILES" | grep -E '^pytau/how_to/model_notebooks/.*\.ipynb$' || true)
          if [ -z "$NOTEBOOKS" ]; then
            echo "No notebook or core library changes in this PR — nothing to execute"
          else
            echo "Re-executing only the notebooks changed in this PR:"
            echo "$NOTEBOOKS"
          fi
        fi

        # Persist the (possibly empty) notebook list for the next step
        {
          echo "notebooks<<EOF"
          echo "$NOTEBOOKS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - name: Execute notebooks and save outputs
      if: steps.changed.outputs.notebooks != ''
      run: |
        echo "Executing model notebooks with outputs..."
        while IFS= read -r notebook; do
          [ -z "$notebook" ] && continue
          echo "Executing $(basename "$notebook")..."
          jupyter nbconvert --to notebook --execute "$notebook" --inplace --ExecutePreprocessor.timeout=300
        done <<< "${{ steps.changed.outputs.notebooks }}"
        echo "All notebooks executed successfully!"
    - name: Upload executed notebooks as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebooks-${{ github.sha }}
        path: pytau/how_to/model_notebooks/*.ipynb
        retention-days: 30
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    - name: Commit executed notebooks
      run: |
        git add pytau/how_to/model_notebooks/*.ipynb
        if git diff --staged --quiet; then
          echo "No changes to commit - notebooks already up to date"
        else
          echo "Committing updated notebooks with execution outputs"
          git commit -m "Auto-update model notebooks with execution outputs

          - Executed all model notebooks with latest code
          - Preserved outputs for documentation and review
          - Generated by GitHub Actions workflow

          [skip ci]"
          git push
        fi
